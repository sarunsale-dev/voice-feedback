<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>บันทึกเสียงลูกค้า</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <div class="hello" id="hello">กำลังโหลด…</div>
      <div class="sub">บันทึกความคิดเห็นลูกค้า</div>
    </div>
    <div class="net" id="net" title="สถานะอินเทอร์เน็ต"></div>
  </header>

  <main id="app" hidden>
    <section class="recorder">
      <button id="mic" class="mic" type="button" aria-label="กดเพื่อพูด">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <div class="mic-hint" id="micHint">แตะเพื่อเริ่มพูด</div>
    </section>

    <textarea id="text" rows="6" placeholder="ข้อความจะขึ้นตรงนี้ แก้ไขหรือพิมพ์เพิ่มได้"></textarea>

    <div class="actions">
      <button id="clear" class="btn ghost" type="button">ล้าง</button>
      <button id="save" class="btn primary" type="button" disabled>บันทึก</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <section class="history">
      <div class="history-head">
        <h2>ล่าสุด</h2>
        <button id="sendNow" class="link" type="button" hidden>ส่งตอนนี้</button>
      </div>
      <ul id="list"></ul>
    </section>
  </main>

  <main id="noUser" class="center" hidden>
    <h2>ยังไม่รู้ว่าคุณคือใคร</h2>
    <p>กรุณาเปิดแอพจาก <b>ลิงก์ส่วนตัว</b> ที่หัวหน้าส่งให้ (ลิงก์ที่ลงท้ายด้วย <code>?u=ชื่อเล่น</code>)</p>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
